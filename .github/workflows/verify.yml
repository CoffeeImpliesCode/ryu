# Verification for this fork of ulfjack/ryu.
#
# This workflow belongs to the fork only. Upstream ships its own CI in
# `.github/workflows/presubmit.yml`, which drives Bazel on upstream's runners;
# that file is kept byte-identical in this tree and is not run here, because
# this fork's build is `build.zig` and nothing in it uses Bazel. Nothing below
# is inherited or retargeted from it.
#
# No run of this file has produced a result. Every step below is an entrypoint
# that exists in build.zig or consumer/build.zig; that is a claim about the
# commands, not a claim that any of them has succeeded.
#
# Gates:
#   * native build, the behaviour suite and the smoke example, in Debug and in
#     ReleaseSafe, plus a C program compiled against the installed headers and
#     linked against the installed archive, which converts and parses and
#     reports what it got;
#   * the runtime-loaded dispatch, built and installed in both delivery
#     variants, with the installed closure asserted to be the same one the
#     linked build produces. Loading a provider and calling `load` need a run
#     and a file on disk, so those gates are the driver's, and this file does
#     not pretend to cover them;
#   * the same C gate against the *shared* delivery (`-Dlinkage=dynamic`),
#     which proves the option delivers a real shared object carrying the same
#     sixteen public entry points and that a C consumer links that object
#     rather than the archive;
#   * the rest of the install closure: `lib/pkgconfig/ryu.pc` resolves `-lryu`
#     and the headers, and every carried licence record is where build.zig's
#     `licence_records` says it is, byte for byte;
#   * the optional 128-bit converter, built with `-Dgeneric128=true` and
#     consumed from a C program against the same two published paths, which
#     also puts `ryu/ryu_generic_128.h` behind `RYU_TRANSLATE_GENERIC_128` in
#     the aggregate header so the translation and the artifact agree;
#   * a compile-only native `check`, plus the refusal that a no-dynamic-linker
#     target gives `-Dlinkage=dynamic`;
#   * `check -Dtarget=` for the six required targets, one job per target so a
#     failure names the target that failed. No step here runs a target binary;
#   * the consumer package, which reaches the module through
#     `b.dependency("ryu", ...).module("ryu")` and a relative `.path`, with the
#     library's `-Dlinkage`, `-Dgeneric128` and `-Druntime` all forwarded into
#     it so a consumer run covers the configuration it names;
#   * a licence and provenance integrity gate, so a rebase cannot quietly drop
#     upstream's terms, the pinned-commit record, or a byte of upstream source.
#     It allows exactly three upstream-tracked paths to differ from the pinned
#     commit: `.gitignore`, which may only gain lines; `ryu/ryu.h`, which must
#     still be upstream's bytes with one include line put back; and `README.md`,
#     which is now this fork's own README, upstream's bytes having moved
#     unchanged to `README.upstream.md` — which the gate checks by digest.
#
# The provenance job checks out the full history on purpose: the integrity gate
# is `git diff` against the pinned upstream commit, that commit has to be an
# ancestor of this fork's, and a default depth-1 checkout cannot resolve it.
#
# The full platform matrix is another gate, and it is not in this file.
# `cross-test`, run from the package root, builds and *runs* `tests.zig` for
# every one of the 53 platforms in Zig 0.16.0's published Tier 1/2 table
# through this repository's own build graph, over the default source closure,
# using `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not
# pretend to cover it and does not stand in for it: the six-target `matrix` job
# below compiles for six targets and runs nothing, and a platform with no
# runner on the host is recorded as explicit `build_only` coverage, never as a
# pass. The command and its receipts belong in README.zig.md and FORK-NOTES.md.

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ZIG_FLAGS: -j8 --summary all --cache-dir .zig-cache

jobs:
  native:
    name: native build, test, smoke (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Before anything is built. UPSTREAM.sha256 is 38 records over the bytes
      # this package compiles, installs and transcribes into testdata/, so this
      # is the last point at which they are only files.
      - name: immutable native source, header, fixture and licence integrity
        run: sha256sum -c UPSTREAM.sha256

      - name: build
        run: zig build -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

      # The install layout, proved by using it. Asserting that four files exist
      # says nothing about whether a C consumer of this package can compile,
      # link and run against them, so this compiles a C program against
      # zig-out/include, links zig-out/lib/libryu.a, runs it, and compares what
      # the conversions produced. Nothing from ryu/ is on the include path:
      # every declaration has to arrive through an installed header or the
      # compile fails, and every expected string below is a literal upstream
      # asserts (transcribed in testdata/), not an answer this package computed.
      #
      # Both optimize modes of this matrix run it. Debug builds the C core with
      # checks on and ReleaseSafe is the mode a consumer would ship; a
      # conversion that differs between the two is a defect one of them hides.
      - name: the installed headers and archive compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface.c" <<'C'
          /* The installed-header C gate for the ryu package.
           *
           * Compiled with `zig cc` against zig-out/include and
           * zig-out/lib/libryu.a and nothing else. The surface reached here is
           * upstream's own C: the shortest, fixed and scientific writers of
           * <ryu/ryu.h> and the experimental parsers of <ryu/ryu_parse.h>,
           * both pulled in by the aggregate <translate.h>. Every status is
           * named by the enum the installed header defines, never a number.
           *
           * The second translation unit of this step includes the two upstream
           * headers on their own, so neither spelling is taken on trust from
           * the other.
           */

          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #include <translate.h>

          /* Values no conversion below produces, so a parse that is meant to
           * be rejected can be shown to have left the caller's variable
           * exactly as it found it. */
          #define SENTINEL64 (-9876.5)
          #define SENTINEL32 (-4321.25f)

          int direct_headers_gate(void);

          /* Upstream's allocating writers hand back a malloc'd, NUL-terminated
           * string the caller owns (ryu/d2s.c:505-509, ryu/f2s.c:341-346, and
           * the same shape in d2fixed.c and d2exp.c). This helper is the only
           * place any of them is called: a NULL return is reported as a
           * failed allocation rather than as a string mismatch, and what
           * upstream allocated is freed here. The *_buffered_n family writes
           * into a buffer the caller supplies and is not used, because the
           * promise this package makes to a C consumer is the variant that
           * owns its memory. */
          static int expect_owned(char *owned, const char *what, const char *want) {
            int failed;
            if (owned == NULL) {
              printf("%s returned NULL\n", what);
              return 1;
            }
            failed = strcmp(owned, want) != 0;
            if (failed) {
              printf("%s: got \"%s\", want \"%s\"\n", what, owned, want);
            } else {
              printf("%s: \"%s\"\n", what, owned);
            }
            free(owned);
            return failed;
          }

          /* One verdict for both parsers. Upstream's own test declares the
           * output variable uninitialised and asserts only the status; this is
           * the stronger statement about the same rows, because every
           * INPUT_TOO_SHORT, INPUT_TOO_LONG and MALFORMED_INPUT return in
           * ryu/s2d.c and ryu/s2f.c comes before the first store to *result,
           * so a rejected parse has to come back with the caller's sentinel
           * still in place. The binary32 sentinel and result are carried as
           * double for the print; both are exactly representable, so the
           * comparison is the float's own. */
          static int expect_parse_result(const char *entry, const char *text,
                                         enum Status status, enum Status want,
                                         double got, double sentinel, double value) {
            if (status != want) {
              printf("%s(\"%s\"): status %d, want %d\n", entry, text,
                     (int) status, (int) want);
              return 1;
            }
            if (want == SUCCESS) {
              if (got != value) {
                printf("%s(\"%s\") = %.17g, want %.17g\n", entry, text, got, value);
                return 1;
              }
            } else if (got != sentinel) {
              printf("%s(\"%s\"): rejected, but wrote %.17g\n", entry, text, got);
              return 1;
            }
            printf("%s(\"%s\") = %.17g (status %d)\n", entry, text, got,
                   (int) status);
            return 0;
          }

          static int expect_parse64(const char *text, enum Status want, double value) {
            double got = SENTINEL64;
            const enum Status status = s2d(text, &got);
            return expect_parse_result("s2d", text, status, want, got,
                                       SENTINEL64, value);
          }

          static int expect_parse32(const char *text, enum Status want, float value) {
            float got = SENTINEL32;
            const enum Status status = s2f(text, &got);
            return expect_parse_result("s2f", text, status, want, (double) got,
                                       (double) SENTINEL32, (double) value);
          }

          /* The explicit-length entry points. Upstream's convenience wrappers
           * are strlen over these (ryu/s2d.c:261-262, ryu/s2f.c:256-257), so a
           * caller that passes the length itself has to pass the same one. */
          static int expect_parse64_n(const char *text, size_t len,
                                      enum Status want, double value) {
            double got = SENTINEL64;
            const enum Status status = s2d_n(text, (int) len, &got);
            return expect_parse_result("s2d_n", text, status, want, got,
                                       SENTINEL64, value);
          }

          static int expect_parse32_n(const char *text, size_t len,
                                      enum Status want, float value) {
            float got = SENTINEL32;
            const enum Status status = s2f_n(text, (int) len, &got);
            return expect_parse_result("s2f_n", text, status, want, (double) got,
                                       (double) SENTINEL32, (double) value);
          }

          int main(void) {
            int rc = 0;
            size_t len;

            /* The two upstream headers reached directly. */
            rc |= direct_headers_gate();

            /* Shortest round-tripping decimal. 1.25 is exactly representable in
             * binary, and 1.2, 1.3 and 1 all read back as different doubles,
             * so its shortest form has three digits; upstream's shortest
             * writer prints digits, a point after the first, an E and a signed
             * exponent. The last two rows are upstream's own cases, where the
             * answer is not the input and could not come from echoing it. */
            rc |= expect_owned(d2s(1.25), "d2s(1.25)", "1.25E0");
            rc |= expect_owned(f2s(1.25f), "f2s(1.25f)", "1.25E0");
            rc |= expect_owned(d2s(2.2250738585072014E-308),
                               "d2s(2.2250738585072014E-308)",
                               "2.2250738585072014E-308");
            rc |= expect_owned(f2s(1.1754944E-38f), "f2s(1.1754944E-38f)",
                               "1.1754944E-38");

            /* Fixed point, with `precision` digits after the point. 0.125 and
             * 0.375 at precision 2 are the rounding rule at a tie in both
             * directions, and 2.5 and 3.5 at precision 0 are the same rule
             * with no digit left to hold it. */
            rc |= expect_owned(d2fixed(1.25, 2), "d2fixed(1.25, 2)", "1.25");
            rc |= expect_owned(d2fixed(0.125, 2), "d2fixed(0.125, 2)", "0.12");
            rc |= expect_owned(d2fixed(0.375, 2), "d2fixed(0.375, 2)", "0.38");
            rc |= expect_owned(d2fixed(2.5, 0), "d2fixed(2.5, 0)", "2");
            rc |= expect_owned(d2fixed(3.5, 0), "d2fixed(3.5, 0)", "4");

            /* Scientific, with `precision` digits after the leading digit and
             * an exponent that always carries a sign and two digits. */
            rc |= expect_owned(d2exp(1.25, 2), "d2exp(1.25, 2)", "1.25e+00");
            rc |= expect_owned(d2exp(0.125, 2), "d2exp(0.125, 2)", "1.25e-01");
            rc |= expect_owned(d2exp(0.125, 1), "d2exp(0.125, 1)", "1.2e-01");
            rc |= expect_owned(d2exp(2.5, 0), "d2exp(2.5, 0)", "2e+00");
            rc |= expect_owned(d2exp(3.5, 0), "d2exp(3.5, 0)", "4e+00");

            /* The parsers, on the same text. "1.25e+2" is seven bytes: a
             * mantissa, a point, an exponent marker, an explicit exponent
             * sign and two exponent digits. The explicit-length entry points
             * are handed strlen's answer rather than a count written out by
             * hand, and the two convenience entry points below have to agree
             * with them, so a mistyped length cannot pass unnoticed. */
            len = strlen("1.25e+2");
            if (len != 7) {
              printf("strlen(\"1.25e+2\") = %lu, want 7\n", (unsigned long) len);
              rc |= 1;
            }
            rc |= expect_parse64_n("1.25e+2", len, SUCCESS, 125.0);
            rc |= expect_parse32_n("1.25e+2", len, SUCCESS, 125.0f);
            rc |= expect_parse64("1.25e+2", SUCCESS, 125.0);
            rc |= expect_parse32("1.25e+2", SUCCESS, 125.0f);

            /* One text, two answers: 123456789 is exact in binary64 and not in
             * binary32, where the nearest float is 123456792. Both rows cannot
             * hold if either parser were forwarding to the other or to a
             * widened copy of itself. */
            rc |= expect_parse64("123456789", SUCCESS, 123456789.0);
            rc |= expect_parse32("123456789", SUCCESS, 123456792.0f);

            /* Upstream's rejected rows. "1..1" carries a second point, "" is
             * empty, and 123456789012345678 is past the 17 nonzero mantissa
             * digits ryu/s2d.c accepts (ryu/s2d.c:100-102); the binary32
             * parser stops at 9 (ryu/s2f.c:94-96), so for it the same text is
             * a rejection with a reason of its own. */
            rc |= expect_parse64("1..1", MALFORMED_INPUT, 0.0);
            rc |= expect_parse32("1..1", MALFORMED_INPUT, 0.0f);
            rc |= expect_parse64("", INPUT_TOO_SHORT, 0.0);
            rc |= expect_parse32("", INPUT_TOO_SHORT, 0.0f);
            rc |= expect_parse64("123456789012345678", INPUT_TOO_LONG, 0.0);
            rc |= expect_parse32("123456789012345678", INPUT_TOO_LONG, 0.0f);

            if (rc != 0) {
              printf("FAILED\n");
              return 1;
            }
            printf("the installed ryu headers and libryu.a agree on every value above\n");
            return 0;
          }
          C
          cat > "$RUNNER_TEMP/direct_headers.c" <<'C'
          /* The same two upstream headers, reached the other way.
           *
           * <translate.h> is the aggregate this package installs and it names
           * <ryu/ryu.h> and <ryu/ryu_parse.h> through the include root. This
           * translation unit is the other spelling: the two headers as a C
           * consumer of upstream's own install rule would name them
           * (CMakeLists.txt:28), with no aggregate in front of them and
           * nothing from ryu/ on the include path. It converts and parses once
           * each, because an include that resolves and a declaration that
           * links to the installed archive are different claims.
           */

          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #include <ryu/ryu.h>
          #include <ryu/ryu_parse.h>

          int direct_headers_gate(void) {
            char *shortest;
            double parsed = -9876.5;

            const enum Status status = s2d("1.25e+2", &parsed);
            if (status != SUCCESS) return 1;
            if (parsed != 125.0) return 2;

            shortest = d2s(1.25);
            if (shortest == NULL) return 3;
            if (strcmp(shortest, "1.25E0") != 0) {
              printf("<ryu/ryu.h> on its own: got \"%s\", want \"1.25E0\"\n",
                     shortest);
              free(shortest);
              return 4;
            }
            free(shortest);

            printf("<ryu/ryu.h> and <ryu/ryu_parse.h> resolve and link on their own\n");
            return 0;
          }
          C
          zig cc -std=gnu17 \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface.c" "$RUNNER_TEMP/direct_headers.c" \
            zig-out/lib/libryu.a \
            -o "$RUNNER_TEMP/c_surface"
          "$RUNNER_TEMP/c_surface"

      - name: test
        run: zig build test -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

      - name: smoke
        run: zig build smoke -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

      # The optional third piece of upstream's C. `-Dgeneric128` is the only
      # thing that compiles ryu/generic_128.c and the only thing that installs
      # ryu/ryu_generic_128.h (build.zig:204-215,227-229); the default graph
      # and the six-target check never reach it. It is built here rather than
      # folded into the step above because it republishes
      # zig-out/lib/libryu.a with one more object in it, so it runs after every
      # step above has read the primary install. Same two optimize modes, for
      # the same reason.
      - name: build with the optional 128-bit converter
        run: zig build -Dgeneric128=true -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

      - name: the installed 128-bit header and archive compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/generic_128_surface.c" <<'C'
          /* The installed-header C gate for the optional 128-bit converter.
           *
           * This is the C consumer of `-Dgeneric128`: it includes the header
           * that option installs, links the archive that option publishes, and
           * calls the five functions the header declares.
           *
           * Nothing here is a claim about any platform but the one this job
           * runs on. Upstream builds its own copy of this unit as a target
           * tagged `nowindows` (ryu/BUILD:38-49) and its header says
           * long_double "likely only works on x86 with specific compilers",
           * which is why the long double row is stated for the native x86_64
           * GNU/Linux runner and why the option is off everywhere else.
           */

          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>

          #include <ryu/ryu_generic_128.h>

          /* generic_to_chars writes without a terminator and returns how many
           * characters it wrote (ryu/ryu_generic_128.h:59-66); the header puts
           * the worst case at 53 bytes, so this buffer is never the reason a
           * row fails. Every row terminates the string itself and checks the
           * count as well as the text. */
          static int expect_chars(const struct floating_decimal_128 v,
                                   const char *want, const char *what) {
            char buffer[64];
            const int written = generic_to_chars(v, buffer);
            if (written <= 0 || written >= (int)sizeof buffer) return 1;
            buffer[written] = '\0';
            if (written != (int) strlen(want) || strcmp(buffer, want) != 0) {
              printf("%s: got \"%s\" (%d bytes), want \"%s\"\n", what, buffer,
                     written, want);
              return 1;
            }
            printf("%s: \"%s\"\n", what, buffer);
            return 0;
          }

          int main(void) {
            int rc = 0;
            /* IEEE binary128: one sign bit, 15 exponent bits with bias 16383
             * and 112 fraction bits, leading bit implicit. 1.25 is 1.01b * 2^0,
             * so the exponent field is 16383 and the fraction is 2^110. This
             * is the layout generic_binary_to_decimal is documented to take -
             * a type the compiler does not define - and it is why that
             * function is in the header at all: the three named converters are
             * the same code with this layout already filled in. */
            const __uint128_t one_point_25 =
                ((__uint128_t) 16383 << 112) | ((__uint128_t) 1 << 110);
            const __uint128_t negative =
                one_point_25 | ((__uint128_t) 1 << 127);

            /* 1.25 through each of the three named types, to the same three
             * digits. Upstream's own generic_128_test.cc prints a shortest
             * value in exactly this shape. */
            rc |= expect_chars(float_to_fd128(1.25f), "1.25E0",
                               "float_to_fd128(1.25f)");
            rc |= expect_chars(double_to_fd128(1.25), "1.25E0",
                               "double_to_fd128(1.25)");
            rc |= expect_chars(long_double_to_fd128(1.25L), "1.25E0",
                               "long_double_to_fd128(1.25L)");

            /* The same value through the layout entry point, once positive and
             * once with the sign bit set, so the sign path is covered too. */
            rc |= expect_chars(generic_binary_to_decimal(one_point_25, 112, 15, false),
                               "1.25E0", "binary128 1.25");
            rc |= expect_chars(generic_binary_to_decimal(negative, 112, 15, false),
                               "-1.25E0", "binary128 -1.25");

            /* Zero in both signs, from upstream's own generic_128_test.cc
             * rows. */
            rc |= expect_chars(float_to_fd128(0.0f), "0E0",
                               "float_to_fd128(0.0f)");
            rc |= expect_chars(float_to_fd128(-0.0f), "-0E0",
                               "float_to_fd128(-0.0f)");

            if (rc != 0) {
              printf("FAILED\n");
              return 1;
            }
            printf("the installed ryu_generic_128.h and libryu.a agree on every value above\n");
            return 0;
          }
          C
          zig cc -std=gnu17 \
            -I zig-out/include \
            "$RUNNER_TEMP/generic_128_surface.c" \
            zig-out/lib/libryu.a \
            -o "$RUNNER_TEMP/generic_128_surface"
          "$RUNNER_TEMP/generic_128_surface"

  shared:
    name: shared delivery and the installed closure (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: immutable native source, header, fixture and licence integrity
        run: sha256sum -c UPSTREAM.sha256

      - name: build the shared delivery
        run: zig build -Dlinkage=dynamic -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

      # The artifact this job is about is a file with a dynamic symbol table, so
      # the first thing to establish is that it is one. An archive wearing the
      # name `libryu.so`, or a `.so` built from nothing, would satisfy every
      # later step for the wrong reason.
      - name: the delivery is a shared object, and carries no invented soname
        run: |
          set -euo pipefail
          lib=zig-out/lib/libryu.so
          test -f "$lib" || { echo "::error::$lib was not installed" >&2; exit 1; }
          file "$lib" | grep -q "ELF .*shared object" || {
            echo "::error::$lib is not an ELF shared object" >&2
            file "$lib" >&2
            exit 1
          }
          # Upstream publishes no ABI number. `CMakeLists.txt:2` declares
          # `project(ryu VERSION 2.0)`, which is the C library's own version
          # line, and the target carries no `VERSION` or `SOVERSION` property;
          # `LibraryOptions.version` is therefore null and a soname here would
          # be this build's invention. Its absence is the property under test,
          # not a missing feature.
          if readelf -d "$lib" | grep -q "SONAME"; then
            echo "::error::$lib carries a SONAME, and upstream declares none" >&2
            readelf -d "$lib" >&2
            exit 1
          fi

      # Every function upstream's two public headers declare, all sixteen, has
      # to be in the dynamic symbol table. This is the assertion that the
      # shared delivery is usable at all: a symbol that was compiled but not
      # exported would still let `file` call it an ELF shared object.
      #
      # The list is transcribed from `ryu/ryu.h:26-40` and
      # `ryu/ryu_parse.h:36-40` rather than generated, so a declaration
      # upstream adds has to be added here too, which is the point. Nothing is
      # asserted about the remaining defined symbols: upstream declares no
      # visibility macro and `build.zig` says so rather than narrowing its
      # export set with a list upstream does not ship.
      - name: all sixteen header-declared entry points are exported
        run: |
          set -euo pipefail
          exported="$(nm -D --defined-only zig-out/lib/libryu.so | awk '{print $3}')"
          for sym in \
            d2s_buffered_n d2s_buffered d2s \
            f2s_buffered_n f2s_buffered f2s \
            d2fixed_buffered_n d2fixed_buffered d2fixed \
            d2exp_buffered_n d2exp_buffered d2exp \
            s2d_n s2d s2f_n s2f
          do
            if ! grep -qx "$sym" <<<"$exported"; then
              echo "::error::$sym is declared by ryu/ryu.h or ryu/ryu_parse.h but is not exported by libryu.so" >&2
              exit 1
            fi
          done
          echo "all 16 declared entry points are exported"

      # The shared delivery's own C consumer. The static job already compiles a
      # C program against the installed archive; this one reaches all sixteen
      # declarations through the dynamic symbol table instead, so an export
      # that is missing fails here at link time and a signature that disagrees
      # with the header fails at load time.
      #
      # Every expected string is upstream's own, transcribed from the vectors in
      # testdata/ and from the shapes upstream's own tests assert: a shortest
      # writer prints digits, a point, an E and a signed exponent; a fixed
      # writer prints exactly `precision` digits after the point; a scientific
      # writer prints `precision` digits after the leading digit and a two-digit
      # signed exponent.
      - name: the installed headers and shared object compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/shared_surface.c" <<'C'
          /* The shared-delivery C gate for the ryu package.
           *
           * Compiled with `zig cc` against zig-out/include and
           * zig-out/lib/libryu.so and nothing else: every declaration has to
           * arrive through an installed header, and every symbol through the
           * object's dynamic symbol table.
           */

          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #include <translate.h>

          /* Every buffer the *_buffered family writes into. Upstream's
           * allocating writers reserve 25 bytes for a shortest double
           * (ryu/d2s.c:505-509) and 2000 for a fixed or scientific one
           * (ryu/d2fixed.c:557-562,809-814), while the `_buffered` forms place
           * no bound at all on the caller's buffer. Every answer below is at
           * most eight characters, so no row here can fail for want of room. */
          #define BUF 64

          static int failures;

          /* Upstream's `*_buffered_n` return the character count and leave the
           * terminator to `*_buffered` (ryu/d2fixed.c:552-555,809-812), so
           * this helper writes the terminator itself and then compares the
           * text. A negative count or one past the buffer is a failure of its
           * own, reported as such rather than used as an index. */
          static void check_text(const char *what, char *out, int len,
                                  const char *want) {
            if (len < 0 || len >= BUF) {
              printf("%s: length %d is not a usable index\n", what, len);
              failures++;
              return;
            }
            out[len] = '\0';
            if (len != (int) strlen(want) || strcmp(out, want) != 0) {
              printf("%s: got \"%s\" (%d), want \"%s\"\n", what, out, len, want);
              failures++;
              return;
            }
            printf("%s: \"%s\"\n", what, out);
          }

          /* Upstream's `d2s`, `f2s`, `d2fixed` and `d2exp` each hand back a
           * malloc'd, NUL-terminated string the caller owns. A NULL return is a
           * failed allocation rather than a wrong answer, and what upstream
           * allocated is freed here so nothing leaks out of the gate. */
          static void check_owned(const char *what, char *owned, const char *want) {
            if (owned == NULL) {
              printf("%s returned NULL\n", what);
              failures++;
              return;
            }
            if (strcmp(owned, want) != 0) {
              printf("%s: got \"%s\", want \"%s\"\n", what, owned, want);
              failures++;
            } else {
              printf("%s: \"%s\"\n", what, owned);
            }
            free(owned);
          }

          /* One verdict for both parsers. The value is carried as double for
           * the print; the binary32 rows compare a float against a float
           * widened once, which is exact, so this is the value's own
           * comparison. */
          static void check_parse(const char *what, enum Status got_status,
                                  enum Status want_status, double got,
                                  double want) {
            if (got_status != want_status) {
              printf("%s: status %d, want %d\n", what, (int) got_status,
                     (int) want_status);
              failures++;
              return;
            }
            if (got != want) {
              printf("%s: %.17g, want %.17g\n", what, got, want);
              failures++;
              return;
            }
            printf("%s: %.17g (status %d)\n", what, got, (int) got_status);
          }

          int main(void) {
            char buffer[BUF];
            double d;
            float f;
            size_t len;

            /* Shortest, binary64. 1.25 is exact in binary and its shortest
             * form is three digits; 2.2250738585072014E-308 is upstream's own
             * smallest-normal row and its answer is longer than a naive
             * shortest writer would give, so it cannot be an echo. */
            check_text("d2s_buffered_n(1.25)", buffer,
                       d2s_buffered_n(1.25, buffer), "1.25E0");
            d2s_buffered(1.25, buffer);
            check_text("d2s_buffered(1.25)", buffer, (int) strlen(buffer), "1.25E0");
            check_owned("d2s(1.25)", d2s(1.25), "1.25E0");
            check_owned("d2s(2.2250738585072014E-308)", d2s(2.2250738585072014E-308),
                        "2.2250738585072014E-308");

            /* Shortest, binary32. 1.1754944E-38f is upstream's own
             * smallest-normal row, and binary32's shortest form has fewer
             * significant digits than binary64's, so this is not the previous
             * row with a suffix changed. */
            check_text("f2s_buffered_n(1.25f)", buffer,
                       f2s_buffered_n(1.25f, buffer), "1.25E0");
            f2s_buffered(1.25f, buffer);
            check_text("f2s_buffered(1.25f)", buffer, (int) strlen(buffer), "1.25E0");
            check_owned("f2s(1.25f)", f2s(1.25f), "1.25E0");
            check_owned("f2s(1.1754944E-38f)", f2s(1.1754944E-38f), "1.1754944E-38");

            /* Fixed point: exactly `precision` digits after the point. 0.125
             * and 0.375 at precision 2 are the rounding rule at a tie in both
             * directions, and 2.5 at precision 0 is the same rule with no digit
             * left to hold it. */
            check_text("d2fixed_buffered_n(1.25, 2)", buffer,
                       d2fixed_buffered_n(1.25, 2, buffer), "1.25");
            d2fixed_buffered(1.25, 2, buffer);
            check_text("d2fixed_buffered(1.25, 2)", buffer, (int) strlen(buffer), "1.25");
            check_owned("d2fixed(1.25, 2)", d2fixed(1.25, 2), "1.25");
            check_text("d2fixed_buffered_n(0.125, 2)", buffer,
                       d2fixed_buffered_n(0.125, 2, buffer), "0.12");
            check_text("d2fixed_buffered_n(0.375, 2)", buffer,
                       d2fixed_buffered_n(0.375, 2, buffer), "0.38");
            check_text("d2fixed_buffered_n(2.5, 0)", buffer,
                       d2fixed_buffered_n(2.5, 0, buffer), "2");

            /* Scientific: `precision` digits after the leading digit, then an
             * exponent that always carries an explicit sign and two digits. */
            check_text("d2exp_buffered_n(1.25, 2)", buffer,
                       d2exp_buffered_n(1.25, 2, buffer), "1.25e+00");
            d2exp_buffered(1.25, 2, buffer);
            check_text("d2exp_buffered(1.25, 2)", buffer, (int) strlen(buffer), "1.25e+00");
            check_owned("d2exp(1.25, 2)", d2exp(1.25, 2), "1.25e+00");
            check_text("d2exp_buffered_n(0.125, 1)", buffer,
                       d2exp_buffered_n(0.125, 1, buffer), "1.2e-01");

            /* The parsers. The length is taken from strlen rather than written
             * out, so the explicit-length entry points and the convenience
             * wrappers are handed the same count and a mistyped length cannot
             * pass unnoticed. */
            len = strlen("1.25e+2");
            if (len != 7) {
              printf("strlen(\"1.25e+2\") = %lu, want 7\n", (unsigned long) len);
              failures++;
            }
            d = -9876.5;
            check_parse("s2d_n(\"1.25e+2\")", s2d_n("1.25e+2", (int) len, &d),
                        SUCCESS, d, 125.0);
            d = -9876.5;
            check_parse("s2d(\"1.25e+2\")", s2d("1.25e+2", &d), SUCCESS, d, 125.0);
            f = -4321.25f;
            check_parse("s2f_n(\"1.25e+2\")", s2f_n("1.25e+2", (int) len, &f),
                        SUCCESS, (double) f, 125.0);
            f = -4321.25f;
            check_parse("s2f(\"1.25e+2\")", s2f("1.25e+2", &f), SUCCESS, (double) f, 125.0);

            /* One text, two answers: 123456789 is exact in binary64 and not in
             * binary32, where the nearest float is 123456792. Both rows cannot
             * hold if either parser were forwarding to the other or to a
             * widened copy of itself. */
            d = -9876.5;
            check_parse("s2d(\"123456789\")", s2d("123456789", &d), SUCCESS, d, 123456789.0);
            f = -4321.25f;
            check_parse("s2f(\"123456789\")", s2f("123456789", &f), SUCCESS,
                        (double) f, 123456792.0);

            /* A rejected parse returns before the first store to *result in
             * both ryu/s2d.c and ryu/s2f.c, so the caller's variable still
             * holds the sentinel it started with. "1..1" carries a second
             * point. */
            d = -9876.5;
            check_parse("s2d(\"1..1\")", s2d("1..1", &d), MALFORMED_INPUT, d, -9876.5);
            f = -4321.25f;
            check_parse("s2f(\"1..1\")", s2f("1..1", &f), MALFORMED_INPUT,
                        (double) f, -4321.25);

            if (failures != 0) {
              printf("FAILED (%d)\n", failures);
              return 1;
            }
            printf("the installed ryu headers and libryu.so agree on every value above\n");
            return 0;
          }
          C
          zig cc -std=gnu17 \
            -I zig-out/include \
            "$RUNNER_TEMP/shared_surface.c" \
            zig-out/lib/libryu.so \
            -o "$RUNNER_TEMP/shared_surface"
          LD_LIBRARY_PATH="$PWD/zig-out/lib" "$RUNNER_TEMP/shared_surface"

      # The rest of the install closure, asserted against the source tree rather
      # than against a list written here: the build graph owns every install
      # path, and `package.nix` lists these same licence paths in
      # meta.licenseFiles and installs nothing by hand, so this step is what
      # keeps the Nix output and a local install one layout.
      - name: the installed closure is complete, relocatable and unmodified
        run: |
          set -euo pipefail
          for header in ryu/ryu.h ryu/ryu_parse.h translate.h; do
            test -s "zig-out/include/$header" || {
              echo "::error::zig-out/include/$header is missing or empty" >&2; exit 1; }
          done
          # The 128-bit header belongs to -Dgeneric128 and to nothing else.
          if [ -e zig-out/include/ryu/ryu_generic_128.h ]; then
            echo "::error::ryu_generic_128.h is installed without -Dgeneric128" >&2
            exit 1
          fi
          test -s zig-out/lib/pkgconfig/ryu.pc || {
            echo "::error::zig-out/lib/pkgconfig/ryu.pc is missing or empty" >&2; exit 1; }

          # Relocatability is a property, not a spelling: the file must derive
          # its prefix from its own location, and pkg-config must then resolve
          # that prefix against this tree with nothing configured in.
          if ! grep -q '^prefix=${pcfiledir}/\.\./\.\.$' zig-out/lib/pkgconfig/ryu.pc; then
            echo "::error::ryu.pc does not derive its prefix from \${pcfiledir}" >&2
            cat zig-out/lib/pkgconfig/ryu.pc >&2
            exit 1
          fi
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          cflags="$(pkg-config --cflags ryu)"
          libs="$(pkg-config --libs ryu)"
          case "$cflags" in
            *"-I$PWD/zig-out/include"*) ;;
            *)
              echo "::error::pkg-config --cflags ryu did not name this tree's include directory: $cflags" >&2
              exit 1
              ;;
          esac
          case "$libs" in
            *"-lryu"*) ;;
            *)
              echo "::error::pkg-config --libs ryu did not name -lryu: $libs" >&2
              exit 1
              ;;
          esac

          # Libs.private states the dependency closure rather than omitting
          # one. The compiled core calls malloc, memcpy, memset and strlen and
          # nothing from libm, so a -lm here would name a dependency this
          # library does not have.
          if ! grep -qx 'Libs.private: -lc' zig-out/lib/pkgconfig/ryu.pc; then
            echo "::error::ryu.pc does not state Libs.private: -lc" >&2
            exit 1
          fi
          if grep -q -- '-lm' zig-out/lib/pkgconfig/ryu.pc; then
            echo "::error::ryu.pc names libm, which this library does not call" >&2
            exit 1
          fi

          # Both upstream grants travel with the binary, and so does every
          # record this fork keeps. Byte-for-byte equality with the source tree
          # is the assertion: a rewritten, merged or truncated copy is the
          # failure this catches, and a missing one is the other.
          for record in \
            LICENSE-Apache2 \
            LICENSE-Boost \
            CONTRIBUTORS \
            NOTICE.md \
            FORK-LICENSE.md \
            UPSTREAM.md \
            README.upstream.md \
            third_party/gtest/LICENSE \
            third_party/junit/LICENSE \
            third_party/mersenne/LICENSE \
            third_party/jaffer/LICENSE \
            third_party/double-conversion/LICENSE \
            third_party/double-conversion/COPYING
          do
            installed="zig-out/share/licenses/ryu/$record"
            test -s "$installed" || { echo "::error::$installed is missing or empty" >&2; exit 1; }
            cmp -s "$record" "$installed" || {
              echo "::error::$installed differs from the source $record" >&2; exit 1; }
          done
          echo "the installed closure is complete, relocatable and byte-identical to its sources"

  runtime:
    name: runtime-loaded dispatch, compile and install (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
        # `-Dlinkage` is orthogonal to `-Druntime`: the artifact is still built
        # and installed, because delivery and dispatch are separate questions
        # and a caller may equally name the provider this tree built or one it
        # did not. Both variants are built here so that is what the tree says.
        linkage: [static, dynamic]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `runtime/loader.zig`, `runtime/generate.zig`, `runtime/sync.c` and
      # `runtime/sync.h` are the reusable loader core the driver owns and copies
      # into this SDK. `runtime/graph.zig` and `runtime/library.zig` reference
      # them by name, so this step is also what proves the copy landed: a
      # missing one is a missing-file error here, not a silent smaller graph.
      - name: build the runtime-loaded dispatch
        run: zig build -Druntime=true -Dlinkage=${{ matrix.linkage }} -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

      # What this job is not. Loading a provider, calling `load`, and every
      # behaviour of the loader between calls needs a provider file on disk and
      # a run, and `Step.Run` in this release has no "must not exit zero" mode,
      # so those gates are run and recorded by the driver rather than asserted
      # here. Asserting them with an expected exit code nobody has observed yet
      # would be a written-down guess, and a guess in a gate is worse than a
      # gate that is honestly missing.
      - name: runtime delivery is orthogonal to linkage, so the install is identical
        run: |
          set -euo pipefail
          # The same closure the linked build installs. `-Druntime` changes how
          # the facade reaches a symbol; it changes nothing about what this
          # package delivers or where it puts it. The headers, the metadata and
          # every licence record are the assertions, and the artifact is checked
          # for the kind `-Dlinkage` named rather than assumed.
          for header in ryu/ryu.h ryu/ryu_parse.h translate.h; do
            test -s "zig-out/include/$header" || {
              echo "::error::zig-out/include/$header is missing or empty under -Druntime=true" >&2; exit 1; }
          done
          test -s zig-out/lib/pkgconfig/ryu.pc || {
            echo "::error::zig-out/lib/pkgconfig/ryu.pc is missing or empty under -Druntime=true" >&2; exit 1; }
          for record in \
            LICENSE-Apache2 LICENSE-Boost CONTRIBUTORS NOTICE.md \
            FORK-LICENSE.md UPSTREAM.md README.upstream.md \
            third_party/gtest/LICENSE third_party/junit/LICENSE \
            third_party/mersenne/LICENSE third_party/jaffer/LICENSE \
            third_party/double-conversion/LICENSE \
            third_party/double-conversion/COPYING
          do
            installed="zig-out/share/licenses/ryu/$record"
            test -s "$installed" || { echo "::error::$installed is missing or empty under -Druntime=true" >&2; exit 1; }
            cmp -s "$record" "$installed" || {
              echo "::error::$installed differs from the source $record" >&2; exit 1; }
          done
          if [ "${{ matrix.linkage }}" = dynamic ]; then
            file zig-out/lib/libryu.so | grep -q "ELF .*shared object" || {
              echo "::error::zig-out/lib/libryu.so is not an ELF shared object" >&2
              file zig-out/lib/libryu.so >&2
              exit 1
            }
          else
            file zig-out/lib/libryu.a | grep -q "current ar archive" || {
              echo "::error::zig-out/lib/libryu.a is not a static archive" >&2
              file zig-out/lib/libryu.a >&2
              exit 1
            }
          fi
          echo "-Druntime=true delivered the ${{ matrix.linkage }} closure unchanged"

      # The dispatch is generated from the translation this build performed, so
      # the count of routed entry points is the count of declarations the header
      # produced, not a hand-written list. Sixteen is what the default aggregate
      # translates; twenty-one is the same aggregate with
      # RYU_TRANSLATE_GENERIC_128 set, which `-Dgeneric128` does.
      - name: the aggregate header declares sixteen entry points, and twenty-one under -Dgeneric128
        run: |
          set -euo pipefail
          zig build install --prefix "$RUNNER_TEMP/generic" -Dgeneric128=true -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS
          # Declared here rather than counted: a C consumer that reaches one
          # name the installed header does not declare would fail to link, and
          # this step is what catches an aggregate that quietly lost or gained
          # an include.
          grep -q "d2s_buffered_n" "$RUNNER_TEMP/generic/include/translate.h" || {
            echo "::error::the installed aggregate header no longer names ryu/ryu.h" >&2; exit 1; }
          test -s "$RUNNER_TEMP/generic/include/ryu/ryu_generic_128.h" || {
            echo "::error::-Dgeneric128=true did not install ryu/ryu_generic_128.h" >&2; exit 1; }
          echo "the -Dgeneric128 closure installs both upstream headers"

  check:
    name: check (compile only, nothing runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: compile the facade, the behaviour suite and the example (static)
        run: zig build check $ZIG_FLAGS

      # The shared delivery is covered per target by the `matrix` job, which
      # carries the `-Dlinkage` dimension. It cannot be a second step here: the
      # native `check` walks all six targets, one of which refuses `-Dlinkage=
      # dynamic` by design.
      - name: a no-dynamic-linker target refuses -Dlinkage=dynamic, and says so
        run: |
          set -euo pipefail
          # `wasm32-wasi` cannot carry a shared object, and the build says so at
          # configure time instead of substituting an archive. A refusal that
          # did not happen would mean this package quietly delivered a static
          # archive for a request to build a shared one, which is exactly the
          # claim this step exists to rule out.
          out="$(zig build check -Dtarget=wasm32-wasi -Dlinkage=dynamic $ZIG_FLAGS 2>&1)" && {
            echo "::error::zig build check -Dtarget=wasm32-wasi -Dlinkage=dynamic succeeded, so the refusal did not happen" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          printf '%s\n' "$out" | grep -q "wasm32-wasi" || {
            echo "::error::the refusal did not name the target that cannot carry a shared object" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          printf '%s\n' "$out" | grep -q "no dynamic linker" || {
            echo "::error::the refusal did not say why" >&2
            printf '%s\n' "$out" >&2
            exit 1
          }
          echo "wasm32-wasi refused -Dlinkage=dynamic by name and by reason"

  matrix:
    name: check ${{ matrix.target }}, ${{ matrix.linkage }} (compile only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both delivery variants, in every cell a target can carry. The one
        # excluded cell is not dropped silently: `wasm32-wasi` has no dynamic
        # linker (`std.Target.DynamicLinker.kind` is `.none`), so `-Dlinkage=
        # dynamic` for it is *refused* by `deliveredLinkage` rather than
        # quietly answered with an archive, and a refused cell cannot be a
        # passing cell. The step in the `check` job below asserts that refusal
        # actually happens and names the OS, so this exclusion is a recorded
        # platform boundary and not a hole in the gate.
        linkage: [static, dynamic]
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
        exclude:
          - target: wasm32-wasi
            linkage: dynamic
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: compile, do not run
        run: zig build check -Dtarget=${{ matrix.target }} -Dlinkage=${{ matrix.linkage }} $ZIG_FLAGS

  consumer:
    name: downstream consumer package (${{ matrix.linkage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library's own `-Dlinkage` and `-Dgeneric128` are forwarded through
        # `consumer/build.zig`, so a consumer run covers the configuration it
        # names rather than the library's default for every cell.
        linkage: [static, dynamic]
        generic128: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: run the consumer
        working-directory: consumer
        run: >-
          zig build run
          -Dlinkage=${{ matrix.linkage }}
          -Dgeneric128=${{ matrix.generic128 }}
          -j8 --summary all --cache-dir .zig-cache

  licence-and-provenance:
    name: licence and provenance integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The integrity gate is `git diff` against the pinned upstream commit
          # and checks that it is an ancestor of HEAD, so the history that
          # contains it has to be present.
          fetch-depth: 0
          submodules: false

      - name: both upstream licence terms are present and carry their own titles
        run: |
          set -eu
          # Ryu is dual licensed: files outside third_party/ are Apache-2.0
          # and the files in ryu/ may alternatively be used under Boost-1.0
          # (README.upstream.md:35-38). Dropping either file would drop terms
          # that upstream grants in the alternative, so both are checked and
          # each is checked for its own title rather than for a shared marker.
          test -s LICENSE-Apache2 || { echo "::error::LICENSE-Apache2 is missing or empty" >&2; exit 1; }
          grep -q "Apache License" LICENSE-Apache2
          grep -q "Version 2.0, January 2004" LICENSE-Apache2
          test -s LICENSE-Boost || { echo "::error::LICENSE-Boost is missing or empty" >&2; exit 1; }
          grep -q "Boost Software License - Version 1.0" LICENSE-Boost

      - name: the provenance record names the pinned upstream commit
        run: |
          set -eu
          pinned=4c0618b0e44f7ef027ebae05d2cc7812048f7c8f
          git cat-file -e "$pinned^{commit}" || {
            echo "::error::the pinned upstream commit is not in this clone" >&2
            exit 1
          }
          git merge-base --is-ancestor "$pinned" HEAD || {
            echo "::error::the pinned upstream commit is not an ancestor of HEAD" >&2
            exit 1
          }
          test -s UPSTREAM.md
          grep -q "$pinned" UPSTREAM.md
          grep -q "ulfjack/ryu" UPSTREAM.md
          for f in FORK-NOTES.md CHANGELOG.md NOTICE.md README.zig.md; do
            test -s "$f" || { echo "::error::$f is missing or empty" >&2; exit 1; }
          done

      # The pinned commit is the reference for every path upstream tracks, and
      # this fork differs from it in three bounded ways. `ryu/ryu.h` used to
      # have to be byte-identical to that commit as well; it no longer does,
      # because a portability fix with an observed cause needed one include
      # line changed. `README.md` is this fork's own README now, so upstream's
      # bytes moved to `README.upstream.md`. Those are stated deviations rather
      # than a widened gate: the step below allows the names, and the two steps
      # after it prove the shape of each one.
      - name: only .gitignore, README.md and ryu/ryu.h differ from the pinned commit
        run: |
          set -eu
          pinned=4c0618b0e44f7ef027ebae05d2cc7812048f7c8f
          # Every path the pinned commit tracks, checked by content rather than
          # by a hand-maintained list, so a new upstream file cannot escape the
          # gate. Fork-added files are untracked paths at the pinned commit and
          # are outside this comparison by construction.
          #
          # Three names are allowed and no others. Each one is a claim a later
          # step checks the shape of, so a name here is never permission to
          # rewrite the file: `.gitignore` may only gain lines, `ryu/ryu.h` may
          # only be upstream's bytes with one include swapped, and `README.md`
          # is this fork's own record, whose upstream half is
          # `README.upstream.md` and is checked by digest below. The test is
          # per path, so the order `git diff` prints does not matter.
          changed="$(git diff --name-only "$pinned" -- $(git ls-tree -r --name-only "$pinned"))"
          for path in $changed; do
            case "$path" in
              .gitignore | README.md | ryu/ryu.h) ;;
              *)
                echo "::error::$path differs from the pinned commit and this fork must not change it. Only .gitignore (additive), README.md (this fork's own README) and ryu/ryu.h (one include line) may differ. See UPSTREAM.md, 'Divergence policy'." >&2
                exit 1
                ;;
            esac
          done
          printf 'upstream-tracked paths differing from %s:\n%s\n' "$pinned" "${changed:-none}"

      # The relocation of upstream's README is checked as content, not as a
      # name, for the same reason the include line below is: a name in the
      # allow-list above is never permission to write anything. The digest is
      # upstream's own, written out here rather than read from a record a
      # rebase could edit to agree with a wrong claim.
      - name: README.upstream.md is upstream's README at the pinned commit, byte for byte
        run: |
          set -eu
          pinned=4c0618b0e44f7ef027ebae05d2cc7812048f7c8f
          upstream_readme=20572708ea26d19fd596f1c4a44097dbcb491cdf0517024d68bbb5d622d0ac93
          digest() { sha256sum | cut -d' ' -f1; }

          test -s README.upstream.md || { echo "::error::README.upstream.md is missing or empty" >&2; exit 1; }
          if [ "$(digest < README.upstream.md)" != "$upstream_readme" ]; then
            echo "::error::README.upstream.md is not upstream's README at $pinned (expected sha256 $upstream_readme)" >&2
            exit 1
          fi
          if [ "$(git cat-file blob "$pinned:README.md" | digest)" != "$upstream_readme" ]; then
            echo "::error::upstream's README.md at $pinned does not hash to $upstream_readme, the digest this step checks" >&2
            exit 1
          fi
          # The other direction matters as much. `README.md` has to be this
          # fork's own record: byte-identical to upstream's would mean the
          # relocation overwrote the fork's document with upstream's and lost
          # every deviation it records.
          if [ "$(digest < README.md)" = "$upstream_readme" ]; then
            echo "::error::README.md is byte-identical to upstream's README, so the fork README was never written" >&2
            exit 1
          fi
          grep -q "ulfjack/ryu" README.upstream.md
          echo "README.upstream.md is upstream's $upstream_readme, unchanged"

      - name: the .gitignore change only adds lines
        run: |
          set -eu
          pinned=4c0618b0e44f7ef027ebae05d2cc7812048f7c8f
          deleted="$(git diff --numstat "$pinned" -- .gitignore | cut -f2)"
          if [ -z "$deleted" ]; then
            deleted=0
          fi
          if [ "$deleted" != "0" ]; then
            echo "::error::.gitignore must keep every upstream entry; $deleted line(s) were removed" >&2
            exit 1
          fi

      # The one deviation from upstream's bytes that is not additive, checked
      # as content rather than as a name. Both digests are the ones
      # `UPSTREAM.sha256` records, so this step fails if either that record or
      # this header is edited to agree with a wrong claim.
      - name: ryu/ryu.h is upstream's bytes with one include line changed
        run: |
          set -eu
          pinned=4c0618b0e44f7ef027ebae05d2cc7812048f7c8f
          pristine=b7feab0ba1df5e9ef3d602f386592ad152491405e49b408fb21c0e0e9e6bfb16
          patched=83ed2a4cd2e42cdd351383b5c937e320e47d8e0ea214964a7b8568f974754dae
          digest() { sha256sum | cut -d' ' -f1; }

          upstream="$RUNNER_TEMP/ryu.h.upstream"
          restored="$RUNNER_TEMP/ryu.h.restored"
          git cat-file blob "$pinned:ryu/ryu.h" > "$upstream"
          if [ "$(digest < "$upstream")" != "$pristine" ]; then
            echo "::error::upstream's ryu/ryu.h at $pinned does not hash to $pristine, the digest this fork records for it" >&2
            exit 1
          fi
          if [ "$(digest < ryu/ryu.h)" != "$patched" ]; then
            echo "::error::this tree's ryu/ryu.h does not hash to $patched, the digest UPSTREAM.sha256 records for it" >&2
            exit 1
          fi

          # The binding check: put the one authorised include back and require
          # upstream's bytes exactly. An edit anywhere else in this header, a
          # second changed line, or an include that moved all change the digest
          # below. The substitution count makes it exact - a header that never
          # carried the patched include cannot pass by not having it.
          if ! awk '$0 == "#include <stdint.h> // Foundation fork: remove unused inttypes.h (2026-10-02)." { print "#include <inttypes.h>"; n++; next } { print } END { if (n != 1) exit 1 }' ryu/ryu.h > "$restored"; then
            echo "::error::this tree's ryu/ryu.h does not carry exactly one disclosed include/change-notice line to put back" >&2
            exit 1
          fi
          if [ "$(digest < "$restored")" != "$pristine" ]; then
            echo "::error::restoring that include does not reproduce upstream's ryu/ryu.h, so the deviation is not that one line" >&2
            diff -u "$upstream" "$restored" || true
            exit 1
          fi
          echo "ryu/ryu.h is upstream's $pristine with one include line swapped"

      - name: upstream's own build files and sources are still where upstream put them
        run: |
          set -eu
          # The C this package compiles is upstream's, in upstream's layout,
          # with the checked-in tables it ships. A relocation would still
          # compile and would no longer be the pinned tree.
          for f in \
            ryu/d2s.c ryu/f2s.c ryu/d2fixed.c ryu/s2d.c ryu/s2f.c \
            ryu/ryu.h ryu/ryu_parse.h ryu/common.h \
            ryu/d2s_full_table.h ryu/d2fixed_full_table.h ryu/f2s_full_table.h \
            ryu/digit_table.h ryu/d2s_small_table.h
          do
            test -s "$f" || { echo "::error::$f is missing or empty" >&2; exit 1; }
          done
          test -s CMakeLists.txt
          test -s MODULE.bazel
